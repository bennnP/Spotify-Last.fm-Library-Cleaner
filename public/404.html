<!doctype html>
<html lang="en">
<head>

  <title>Page Not Found | Spotify Library Cleanup</title>
  <meta name="description" content="The Spotify Library Cleanup page you requested could not be found.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="http://127.0.0.1:3000/404.html">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: "Trebuchet MS", "Segoe UI", sans-serif; --canvas: #f4f6f5; --surface: #fff; --ink: #202624; --muted: #66716c; --line: #d4dbd7; --accent: #1f8f59; }
    * { box-sizing: border-box; }
    body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: var(--canvas); place-items: center; }
    main { width: min(620px, calc(100% - 2rem)); padding: 3rem 0; }
    .eyebrow { color: var(--accent); font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: .5rem 0 1rem; font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1; }
    p { max-width: 44rem; color: var(--muted); line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    a { color: var(--accent); font-weight: 700; }
    a:focus-visible { outline: 3px solid #2b6d9b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">Page not found</span></nav>
    <p class="eyebrow">404 · Missing page</p>
    <h1>That page is not here.</h1>
